# Railway config-as-code: https://docs.railway.com/reference/config-as-code
# Required service variables (set in the Railway dashboard):
#   DATABASE_URL  — e.g. from the Postgres plugin (${{Postgres.DATABASE_URL}})
#   CORS_ORIGINS  — your Railway app URL(s), comma-separated
# Optional: GEMINI_API_KEY, AI_PROVIDER, etc. (see .env.example)

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
