# Railway config for the static UI service.
# Point Railway at this folder via the service's "Root Directory" = frontend.
# Required service variables (set in the Railway dashboard):
#   API_UPSTREAM — internal URL of the API service, e.g. http://${{<api-service>.RAILWAY_PRIVATE_DOMAIN}}:8000

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
