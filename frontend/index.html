<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- script.js getApiBase() reads this; "/api" works for both the nginx proxy
         (Docker Compose, Railway) and any reverse proxy that exposes /api/*. -->
    <meta name="treenotes-api-base" content="/api">
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
    <title>Tree Notes</title>
</head>
<body>

    <!-- Floating App Menu -->
    <div id="appMenu">
        <button type="button" id="menuIcon" class="menu-icon-btn" aria-label="Open menu" aria-haspopup="true" aria-expanded="false" title="Menu">☰</button>
        <div id="menuPopup">
            <header class="menu-header">📘 TreeNotes</header>

            <section class="menu-section menu-section--actions">
                <button type="button" class="menu-action-btn" id="toggleDarkMode">
                    <span class="menu-action-btn__icon" aria-hidden="true">🌓</span>
                    <span>Toggle Dark Mode</span>
                </button>
                <button type="button" class="menu-action-btn" id="help">
                    <span class="menu-action-btn__icon" aria-hidden="true">❓</span>
                    <span>Help</span>
                </button>
                <button type="button" class="menu-action-btn" id="about">
                    <span class="menu-action-btn__icon" aria-hidden="true">ℹ️</span>
                    <span>About</span>
                </button>
            </section>

            <hr class="menu-divider" />

            <section class="menu-section menu-section--field">
                <label class="menu-label" for="ollama-model">Ollama model</label>
                <input type="text" class="menu-input" id="ollama-model" value="llama3"
                       title="Server reads OLLAMA_MODEL from env; this field is reserved for future UI wiring.">
                <p class="menu-hint">Used only when the server runs with <code>AI_PROVIDER=ollama</code>.</p>
            </section>

            <section class="menu-section menu-section--toggle">
                <label class="menu-toggle">
                    <input type="checkbox" id="framework-of-trust">
                    <span>Framework of Trust</span>
                </label>
            </section>

            <hr class="menu-divider" />

            <section class="menu-section menu-section--field menu-api-row">
                <label class="menu-label" for="api-base-url">API URL</label>
                <input type="url" class="menu-input" id="api-base-url"
                       placeholder="http://127.0.0.1:8000" autocomplete="off">
                <span id="apiNoteIndicator" class="api-note-indicator" title="Current server note id" hidden></span>
                <div class="menu-api-actions">
                    <button type="button" class="menu-api-btn" id="apiSaveBtn" title="Save to server (API)">
                        <span aria-hidden="true">☁️</span> Save
                    </button>
                    <button type="button" class="menu-api-btn" id="apiOpenBtn" title="Open from server">
                        <span aria-hidden="true">📂</span> Open
                    </button>
                    <button type="button" class="menu-api-btn" id="apiNewBtn" title="New local note">
                        <span aria-hidden="true">📄</span> New
                    </button>
                </div>
            </section>
        </div>
    </div>

    <div id="title-bar">
        <h1>Tree Notes</h1>
        <button id="fullscreen-btn">⛶</button>
    </div>
    <main id="cornellLayout">
        <div id="heading" class="cornell-heading">
            <div id="headingText" contenteditable="true" data-placeholder="Cornell Note Heading"></div>
        </div>

        <div class="cornell-body">
            <section id="text" class="cornell-column cornell-column--cue">
                <header class="column-title">Cue Column</header>
                <div class="container" id="cueText" contenteditable="true" data-placeholder="Cue column data, key words, key questions"></div>
            </section>

            <div id="cornell-resizer"></div>

            <section id="tree" class="cornell-column cornell-column--notes">
                <div class="container">
                    <div id="toolbarBar" class="notes-toolbar">
                        <button class="button" onclick="createNewBlock()" title="Add box">➕</button>
                        <button class="button" onclick="zoom(1.1)" title="Zoom in">🔍</button>
                        <button class="button" onclick="zoom(0.9)" title="Zoom out">🔎</button>
                        <button class="button" id="gridToggle" aria-pressed="false" title="Toggle guide grid">#️⃣</button>
                        <button class="button" id="dictateToggle" aria-pressed="false" title="Toggle dictation">🎙️</button>
                        <button class="button" id="analyzeNotesBtn" title="Analyze notes via API (Gemini or Ollama on server)">🤖</button>
                        <button class="button" onclick="download()" title="Download notes">💾</button>
                        <button class="button" onclick="upload()" title="Upload notes">⬆️</button>
                        <button class="button" onclick="noteInfo()" title="Note info">📝</button>
                    </div>

                    <div id="statusMessage" class="status-message" aria-live="polite"></div>

                    <div id="treeQuickMenu" class="tree-menu" role="menu" aria-hidden="true">
                        <img src="logo/TreenotesICON.png" alt="Tree Notes menu icon" class="tree-menu__icon">
                        <button type="button" class="tree-menu__item" data-action="info">Info</button>
                        <button type="button" class="tree-menu__item" data-action="help">Help</button>
                        <button type="button" class="tree-menu__item" data-action="dark">Toggle Dark Mode</button>
                    </div>

                    <div id="zoom" class="zoom">
                        <div id="boxes">
                            <div id="1" class="box" contenteditable="true" style="background-color: #f1f1f1;">Seed</div>
                        </div>
                        <svg id="lines"></svg>
                    </div>
                </div>
            </section>
        </div>

        <div id="notes" class="cornell-summary">
            <header class="column-title column-title--summary">Summary</header>
            <div id="notesText" contenteditable="true" data-placeholder="Type your summary here..."></div>
        </div>
    </main>

    <aside id="analysisPanel" class="analysis-panel" aria-label="LLM Insights side panel">
        <button type="button" class="analysis-panel__header" id="analysisHeader" aria-expanded="true" aria-controls="analysisBody">
            <span class="analysis-panel__chevron" aria-hidden="true">▾</span>
            <span class="analysis-panel__title">LLM Insights</span>
            <span class="analysis-panel__close" id="closeAnalysis" role="button" tabindex="0" aria-label="Hide AI insights">✕</span>
        </button>
        <div class="analysis-panel__body" id="analysisBody">
            <div id="analysisContent" class="analysis-panel__content"></div>
            <div id="analysisConcepts" class="analysis-panel__section" hidden>
                <h4 class="analysis-panel__section-title">Concepts</h4>
                <div id="conceptsList" class="concept-chips"></div>
            </div>
            <div id="analysisSuggested" class="analysis-panel__section" hidden>
                <h4 class="analysis-panel__section-title">Suggested links</h4>
                <ul id="suggestedLinksList" class="suggested-links"></ul>
            </div>
        </div>
    </aside>

    <div id="toolbar" class="toolbar">
        <input id="boxColor" type="color" aria-label="Box Color">
        <button id="addBox">Add Box+</button>
        <button id="deleteBox">Delete Box🗑️</button>
        <div id="link" class="dropdown">
            <button class="dropdown-button">Link 🖇️</button>
            <div class="dropdown-content"></div>
        </div>
    </div>


    <dialog id="apiOpenDialog" class="api-open-dialog">
        <div class="api-open-dialog__inner">
            <header class="api-open-dialog__header">Open from server</header>
            <p id="apiOpenError" class="api-open-dialog__error" hidden></p>
            <ul id="apiOpenList" class="api-open-list"></ul>
            <div class="api-open-dialog__actions">
                <button type="button" id="apiOpenRefresh">Refresh</button>
                <button type="button" id="apiOpenCancel">Close</button>
            </div>
        </div>
    </dialog>

    <div id="textToolbar" class="toolbar">
        <input id="t_boxColor" type="color" value="#eeeeee" aria-label="Highlight Color">
        <select id="t_dropdown"></select>
        <button id="t_remove">-</button>
    </div>
</body>
</html>
